[project]
name = "pyprojects"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flask>=3.1.3",
    "numpy>=2.5.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
