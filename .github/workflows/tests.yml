name: tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs, not mutable tags; Dependabot
      # (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # Installs that Python version and the exact locked dependencies.
      - run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: ruff
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .

      # -rs lists any skipped test; -W error turns warnings into failures.
      - run: uv run --frozen pytest -rs -W error
