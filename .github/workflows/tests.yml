name: tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # Installs Python (per requires-python) and the exact locked dependencies.
      - run: uv sync --frozen

      # -rs lists any skipped test; -W error turns warnings into failures.
      - run: uv run --frozen pytest -rs -W error
